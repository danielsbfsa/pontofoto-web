name: Publicar app web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Testes das regras
        run: node --test tests/logic.test.mjs

      - name: Montar o site e incluir as bibliotecas
        run: |
          mkdir -p _site
          cp -r index.html privacidade.html manifest.webmanifest sw.js css js icons _site/
          mkdir -p /tmp/libs && cd /tmp/libs && npm init -y >/dev/null
          npm install --no-audit --no-fund tesseract.js@5 tesseract.js-core@5 @tesseract.js-data/por pdfjs-dist@3.11.174 @fontsource-variable/manrope
          V=$GITHUB_WORKSPACE/_site/vendor
          mkdir -p $V/tesseract $V/tesseract-core $V/lang $V/pdfjs $V/fonts
          cp node_modules/tesseract.js/dist/tesseract.min.js node_modules/tesseract.js/dist/worker.min.js $V/tesseract/
          cp node_modules/tesseract.js-core/tesseract-core*.js $V/tesseract-core/
          cp node_modules/tesseract.js-core/tesseract-core*.wasm $V/tesseract-core/ 2>/dev/null || true
          LANG_FILE=$(find node_modules/@tesseract.js-data/por -path '*best_int*' -name 'por.traineddata.gz' | head -1)
          [ -z "$LANG_FILE" ] && LANG_FILE=$(find node_modules/@tesseract.js-data/por -name 'por.traineddata.gz' | head -1)
          cp "$LANG_FILE" $V/lang/por.traineddata.gz
          cp node_modules/pdfjs-dist/build/pdf.min.js node_modules/pdfjs-dist/build/pdf.worker.min.js $V/pdfjs/
          cp node_modules/@fontsource-variable/manrope/files/manrope-latin-wght-normal.woff2 $V/fonts/manrope.woff2
          ls -la $V/*

      - name: Publicar na branch gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true
